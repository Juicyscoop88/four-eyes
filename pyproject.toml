[project]
name = "foureyes"
version = "0.1.0"
description = "FourEyes: a software factory where nobody, human or agent, checks their own work"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1",
    "pyyaml>=6",
]

[project.scripts]
foureyes = "foureyes.cli:main"

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools/foureyes"]  # src/orders is the sample domain of this repo, not part of FourEyes

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
