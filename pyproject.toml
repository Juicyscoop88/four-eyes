[project]
name = "tradefactory"
version = "0.1.0"
description = "A merge gate for agent-written changes in a regulated trading codebase (case study prototype)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6"]

[project.scripts]
gate = "gate.cli:main"

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orders", "tools/gate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
