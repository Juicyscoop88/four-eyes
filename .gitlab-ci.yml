# The gate on every merge request. The same command as on a laptop: `uv run gate check --agents`.
# GitLab's own scanners run beside it; we reuse them, we do not rebuild them.

include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/SAST.gitlab-ci.yml

stages: [test, gate]

variables:
  GIT_DEPTH: "0"   # the gate diffs against the merge request's base

four-eyes:
  stage: gate
  image: ghcr.io/astral-sh/uv:python3.12-bookworm
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl git > /dev/null
    - curl -fsSL https://claude.ai/install.sh | bash
    - export PATH="$HOME/.local/bin:$PATH"
    - uv sync --frozen
  script:
    # ANTHROPIC_API_KEY (or Vertex credentials through Workload Identity) is a masked CI variable.
    - uv run gate check --agents
  after_script:
    # The report goes to the merge request as a comment from the factory's own bot account
    # (a project access token), never from an engineer's account.
    - >
      curl -sS --fail --header "PRIVATE-TOKEN: $FACTORY_BOT_TOKEN"
      --data-urlencode "body@gate-report.md"
      "$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests/$CI_MERGE_REQUEST_IID/notes" > /dev/null
  artifacts:
    when: always
    paths: [gate-report.md]
