# The factory's one file per repo: what people own, and how strict the gate is per path.
# Owned paths are changed only by their owners (CODEOWNERS approval). Agents never edit them.

owned:
  - factory.yaml
  - invariants/**
  - tests/invariants/**
  - tools/**        # the gate itself: an agent never edits what judges it
  - plugin/**
  - .github/**

invariants:
  - invariants/orders.yaml

# Standards: how things are done here. Softer than invariants: the agent gets them as advice
# (rules_for in the MCP server), the reviewer checks them, and what can be measured is measured.
standards:
  - paths: ["apps/**"]
    file: standards/design-system.md
  - paths: ["apps/**"]
    file: standards/optimistic-ui.md
  - paths: ["src/**"]
    file: standards/money.md

# The three kinds of tests. The gate measures each one separately.
suites:
  author: tests/unit          # written by whoever wrote the code
  tester: tests/blind         # written by the tester, who never saw the code
  invariants: tests/invariants  # owned by people

tiers:
  money:
    paths: ["src/orders/**"]
    mutation_min: 0.8     # share of injected faults the tester and invariant tests must catch
    approver: senior      # CODEOWNERS group that approves
  standard:
    paths: ["src/**"]
    mutation_min: 0.5
  low:
    paths: ["**"]
    mutation_min: 0.0

agents:
  # A tester on the same model as the author shares its blind spots. Different models, on purpose.
  # Hermetic: each role gets only the MCP servers named here, never the ones installed on the laptop or
  # runner it runs on. The author may ask FourEyes what applies; the tester and reviewer get nothing more.
  author:   { model: sonnet, mcp: [foureyes] }
  tester:   { model: opus,   mcp: [] }
  reviewer: { model: sonnet, mcp: [] }

# MCP servers a repo adds for its agents (the shape of .mcp.json), for example its tracker:
# mcp:
#   gitlab: { command: npx, args: ["-y", "@modelcontextprotocol/server-gitlab"] }
