# The gate on every pull request. The same command as on a laptop: `foureyes check --agents`.
# On GitLab the same job is .gitlab-ci.yml; the gate does not care where it runs.
name: four-eyes

on:
  pull_request:
  workflow_call:  # other repos call this same workflow: their factory.yaml, this repo's gate
    inputs:
      setup: { type: string, default: "", description: "the project's own setup, for example `uv sync` or `pip install -e .[test]`" }
      foureyes: { type: string, default: "git+https://github.com/Juicyscoop88/four-eyes@v0.2.0" }

permissions:
  contents: read
  pull-requests: write

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v6
      - name: FourEyes
        env:
          SOURCE: ${{ inputs.foureyes }}
          TOKEN: ${{ secrets.FOUREYES_TOKEN }}
        run: |
          if [ -d tools/foureyes ]; then uv sync --frozen; echo "FE=uv run foureyes" >> "$GITHUB_ENV"; exit 0; fi
          # FourEyes from its own repo (private: a read-only token as the secret FOUREYES_TOKEN)
          [ -n "$TOKEN" ] && git config --global url."https://x-access-token:$TOKEN@github.com/".insteadOf "https://github.com/"
          uv tool install "$SOURCE" && echo "FE=foureyes" >> "$GITHUB_ENV"
      - name: the project's own setup
        if: inputs.setup != ''
        run: ${{ inputs.setup }}
      - run: curl -fsSL https://claude.ai/install.sh | bash && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: gate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FACTORY_TASK: ${{ github.event.pull_request.body }}
          FACTORY_REQUESTED_BY: ${{ github.event.pull_request.user.login }}
        # Without the key the reviewer does not run, and the report says so.
        run: $FE check --base "origin/${{ github.base_ref }}" ${{ secrets.ANTHROPIC_API_KEY != '' && '--agents' || '' }}
      - name: report on the pull request
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file gate-report.md --edit-last --create-if-none
