# The gate on every pull request. The same command as on a laptop: `foureyes check --agents`.
# On GitLab the same job is .gitlab-ci.yml; the gate does not care where it runs.
name: four-eyes

on:
  pull_request:
  workflow_call:  # other repos call this same workflow: their factory.yaml, this repo's gate
    inputs:
      setup: { type: string, default: "", description: "the project's own setup, for example `uv sync` or `pip install -e .[test]`" }
      foureyes: { type: string, default: "git+https://github.com/Juicyscoop88/four-eyes@v0.2.1" }

permissions:
  contents: read
  pull-requests: write

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Bugs and CLAUDE.md: Anthropic's own code-review plugin, not ours. It comments inline on the pull request.
  # FourEyes' reviewer only makes the decision cards and checks the task and the invariants.
  review:
    # Not for pull requests from forks: the key and write access never reach code from outside the company.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: anthropics/claude-code-action@4411a9e9b0283becf4b924f7bce360fd7756c78c  # v1, pinned to a commit
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}   # the workflow's own token: no extra GitHub App to approve
          plugin_marketplaces: https://github.com/anthropics/claude-plugins-official.git
          plugins: code-review@claude-plugins-official
          prompt: /code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"

  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v6
      - name: FourEyes
        env:
          SOURCE: ${{ inputs.foureyes }}
          TOKEN: ${{ secrets.FOUREYES_TOKEN }}
        run: |
          if [ -d tools/foureyes ]; then uv sync --frozen; echo "FE=uv run foureyes" >> "$GITHUB_ENV"; exit 0; fi
          # FourEyes from its own repo (private: a read-only token as the secret FOUREYES_TOKEN)
          [ -n "$TOKEN" ] && git config --global url."https://x-access-token:$TOKEN@github.com/".insteadOf "https://github.com/"
          uv tool install "$SOURCE" && echo "FE=foureyes" >> "$GITHUB_ENV"
      - name: the project's own setup
        if: inputs.setup != ''
        run: ${{ inputs.setup }}
      - run: curl -fsSL https://claude.ai/install.sh | bash && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: gate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FACTORY_TASK: ${{ github.event.pull_request.body }}
          FACTORY_REQUESTED_BY: ${{ github.event.pull_request.user.login }}
        # Without the key the reviewer does not run, and the report says so.
        run: $FE check --base "origin/${{ github.base_ref }}" ${{ secrets.ANTHROPIC_API_KEY != '' && '--agents' || '' }}
      - name: report on the pull request
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file gate-report.md --edit-last --create-if-none
